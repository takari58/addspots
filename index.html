<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新発田街歩きアプリ</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ランドマーククイズ</h1>
    </header>

<!-- 合計得点 -->
<div id="totalScore">
    現在の得点：0点
</div>

<div id="map"></div>

<div id="coords"></div> 

<div id="result">現在地を取得中...</div>

<!-- スポット追加 -->
<button id="openAddForm" class="add-btn">
    ＋ スポット・クイズを追加
</button>
<br>
<form id="addSpotForm" hidden>

    <h2>新しいスポットを追加</h2>

    <label>スポットの種類</label>
    <select id="spotType">
        <option value="normal">ノーマルスポット</option>
        <option value="rare">激レアスポット</option>
    </select>

    <div id="rareSettings" hidden>
        <label>解放ポイント</label>
        <input type="number" id="unlockPoint" value="0">
    </div>

    <label>スポット名</label>
    <input type="text" id="spotName">

    <label>緯度</label>
    <input type="number" step="any" id="spotLat">

    <label>経度</label>
    <input type="number" step="any" id="spotLng">

    <label>クイズ可能範囲（m）</label>
    <input type="number" id="spotRadius" value="50">

    <label>画像パス（任意）</label>
    <input type="text" id="spotImage">

    <hr>

    <h3>クイズ1</h3>

    <label>問題文</label>
    <input type="text" id="q1">

    <label>正解</label>
    <select id="a1">
        <option value="true">〇</option>
        <option value="false">×</option>
    </select>

    <label>解説</label>
    <textarea id="e1"></textarea>

    <h3>クイズ2</h3>

    <label>問題文</label>
    <input type="text" id="q2">

    <label>正解</label>
    <select id="a2">
        <option value="true">〇</option>
        <option value="false">×</option>
    </select>

    <label>解説</label>
    <textarea id="e2"></textarea>

    <h3>クイズ3</h3>

    <label>問題文</label>
    <input type="text" id="q3">

    <label>正解</label>
    <select id="a3">
        <option value="true">〇</option>
        <option value="false">×</option>
    </select>

    <label>解説</label>
    <textarea id="e3"></textarea>

    <div class="form-buttons">

        <button type="submit">
            スポットとクイズを登録
        </button>

        <button
            type="button"
            id="cancelAddForm">
            キャンセル
        </button>

    </div>

    <p id="addSpotMessage"></p>

</form>

<!-- 追加スポット削除 -->
<button onclick="deleteAddedSpots()"
        id="deleteAddedBtn">
    追加スポットを削除
</button>
<br>
<!-- 開発用リセットボタン -->
<button id="resetButton" onclick="resetGame()">
    得点・回答履歴をリセット
</button>

<!-- 激レア解放演出 
<div id="unlockModal" class="unlock-modal">
    <div class="unlock-content">
        <div class="unlock-stars">
            ⭐⭐⭐⭐⭐
        </div>

        <h2>激レアスポット解放！</h2>

        <h3 id="unlockSpotName"></h3>

        <p>
            地図に新しいスポットが出現しました
        </p>

        <button onclick="closeUnlockModal()">
            OK
        </button>
    </div>
</div>
-->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
